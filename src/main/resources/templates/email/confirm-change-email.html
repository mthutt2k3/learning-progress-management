<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Xác nhận thay đổi email</title>
</head>
<body>
<p>Xin chào <span th:text="${fullName}">bạn</span>,</p>
<p>Bạn đã yêu cầu thay đổi email tài khoản sang <span th:text="${newEmail}">[new email]</span>.</p>
<p>Vui lòng nhấn vào liên kết sau để xác nhận thay đổi:</p>
<p><a th:href="${confirmLink}" th:text="${confirmLink}">[Confirm Link]</a></p>
<p>Nếu bạn không thực hiện yêu cầu này, vui lòng bỏ qua email này.</p>
<p>Trân trọng,<br/>Hệ thống LPMS</p>
</body>
</html>
