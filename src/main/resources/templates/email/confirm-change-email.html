<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Xác nhận thay đổi email</title>
</head>
<body>
<p>Xin chào <strong th:text="${fullName}">bạn</strong>,</p>
<p>Bạn đã yêu cầu thay đổi email đăng nhập thành: <strong th:text="${newEmail}">email</strong>.</p>
<p>Vui lòng nhấn vào liên kết bên dưới để xác nhận:</p>
<p>
    <a th:href="${confirmLink}" th:text="${confirmLink}">Xác nhận thay đổi email</a>
</p>
<p>Nếu bạn không thực hiện yêu cầu này, vui lòng bỏ qua email này.</p>
<p>Trân trọng,</p>
<p>Hệ thống quản lý học tập</p>
</body>
</html>
