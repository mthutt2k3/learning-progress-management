name: Build and deploy JAR app to Azure Web App - learning-progress-management

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A6AA1B62C009428EB49F63CA7CA91E07 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_365606C5843843DCAEA595966DEC6490 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_82AE1F0B8A824FA39DCBFED025913400 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'learning-progress-management'
          slot-name: 'Production'
          package: '${{ github.workspace }}/target/*.jar'
