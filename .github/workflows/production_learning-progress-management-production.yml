name: Build and deploy JAR app to Azure Web App - learning-progress-management-production

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build-and-deploy:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CA64F531278F4A7DB8B3FC70117BA3A5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F446A4AE91394F3AA6BE5E51873A3ACA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8D5740E16BF24AE998D2FC9284F66905 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'learning-progress-management-production'
          slot-name: 'Production'
          package: '${{ github.workspace }}/target/*.jar'
